<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add VDOO to Your Wallet</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; text-align: center; padding: 2rem; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 2rem; max-width: 500px; margin: auto; border: 1px solid #333; }
        .addr { background: #222; padding: 0.8rem; border-radius: 8px; word-break: break-all; font-family: monospace; color: #4fc3f7; }
        .btn { display: inline-block; margin: 1rem 0; padding: 0.8rem 2rem; background: #4fc3f7; color: #000; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn:hover { background: #3aa8d4; }
        .qr { margin: 1rem auto; max-width: 200px; }
        img { width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h1>➕ Add VDOO to Your Wallet</h1>
        <p style="color:#aaa;">Voxel Resonance ecosystem token</p>
        <div class="addr" id="address">0x38e4f08D08b4D772A7B75669C356b4749dd2d30b</div>
        <button class="btn" onclick="copyAddress()">📋 Copy Address</button>
        <p>Then open your Base wallet and tap "Import token" – paste the address.</p>
        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=ethereum:0x38e4f08D08b4D772A7B75669C356b4749dd2d30b@8453" alt="QR code for VDOO">
        </div>
        <p style="font-size:0.8rem; color:#666;">QR code includes chain ID (Base) for easy import.</p>
        <p><a href="https://basescan.org/token/0x38e4f08D08b4D772A7B75669C356b4749dd2d30b" target="_blank" style="color:#4fc3f7;">View on BaseScan</a></p>
        <p><a href="https://jvoidial.github.io/spirit-guide-token/" style="color:#4fc3f7;">Back to Dashboard</a></p>
    </div>
    <script>
        function copyAddress() {
            const addr = document.getElementById('address').innerText;
            navigator.clipboard.writeText(addr).then(() => {
                alert('Address copied to clipboard!');
            }).catch(() => {
                // fallback
                const textarea = document.createElement('textarea');
                textarea.value = addr;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Address copied!');
            });
        }
    </script>
</body>
</html>
