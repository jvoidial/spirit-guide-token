name: Voxel Resonance Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set Git identity
        run: |
          git config user.email "jvoidial@users.noreply.github.com"
          git config user.name "jvoidial"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Run bot
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: python3 bot.py
          
      - name: Commit and push
        run: |
          git add .
          git commit -m "Auto-update from Voxel Bot" || echo "No changes"
          git pull --rebase origin main
          git push origin main
