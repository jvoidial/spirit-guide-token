name: Voxel Resonance Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install web3 python-dotenv requests

      - name: Run bot
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          METAL_API_KEY: ${{ secrets.METAL_API_KEY }}
        run: |
          echo "PRIVATE_KEY=$PRIVATE_KEY" > .env
          echo "METAL_API_KEY=$METAL_API_KEY" >> .env
          python3 master_controller.py

      - name: Commit and push JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "Auto-update JSONs $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push origin main
