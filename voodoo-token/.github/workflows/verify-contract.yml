name: Verify Contract on BaseScan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Verify VDOO
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          forge verify-contract 0x38e4f08D08b4D772A7B75669C356b4749dd2d30b \
            src/VDOOToken.sol:VDOOToken \
            --chain base \
            --etherscan-api-key "$ETHERSCAN_API_KEY" \
            --watch
