name: Deploy MiniBrain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy MiniBrain
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          BYTECODE=""
          echo ">>> Deploying MiniBrain for VDOO..."
          forge create --bytecode "$BYTECODE" \
            --rpc-url https://mainnet.base.org \
            --private-key "$PRIVATE_KEY" \
            --constructor-args "0x38e4f08D08b4D772A7B75669C356b4749dd2d30b" \
            --legacy \
            --gas-limit 80000 \
            --gas-price 10000000 \
            --broadcast 2>&1 | tee /dev/stderr | grep -oP 'Deployed to: \K0x[a-fA-F0-9]{40}' > /tmp/brain_addr.txt
          ADDR=$(cat /tmp/brain_addr.txt)
          if [ -z "$ADDR" ]; then echo "FAILED"; exit 1; fi
          echo "MiniBrain: $ADDR"
          echo "- MiniBrain: $ADDR" >> deployed-addresses.md
      - name: Commit deployed address
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add MiniBrain address"
          file_pattern: "deployed-addresses.md"
