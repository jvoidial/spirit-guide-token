name: Verify VDOO via Base Explorer

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Verify on Base Explorer
        run: |
          forge verify-contract 0x38e4f08D08b4D772A7B75669C356b4749dd2d30b \
            src/VDOOToken.sol:VDOOToken \
            --chain base \
            --verifier blockscout \
            --verifier-url https://base.blockscout.com/api \
            --compiler-version 0.8.20 \
            --optimizer-runs 200 \
            --watch
          echo "✅ VDOO verified on Base Explorer"
